name: Hindiba · uygulama ve içerik kontrolleri

on:
  pull_request:
    branches: [main]
  push:
    branches: ['codex/hindiba-cms-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hindiba-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: İçerik, güvenlik ve tarayıcı akışları
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Kilitli bağımlılıkları kur
        run: npm ci
      - name: Uygulamayı derle
        run: npm run build
      - name: Uygulama ve aktarım testleri
        run: npm test
      - name: Gerçek içeriği aktar ve birebir karşılaştır
        run: |
          mkdir -p work
          npm run import
          npm run import
          npm run verify -- --report work/ci-migration-report.json
      - name: Bağımlılık güvenlik taraması
        run: npm audit --audit-level=low
      - name: Chromium test ortamını hazırla
        run: npx playwright install --with-deps chromium
      - name: Yönetim panelini ve okuyucuyu tarayıcıda doğrula
        run: npm run test:e2e
      - name: Doğrulama raporlarını sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hindiba-verification-${{ github.run_number }}
          path: |
            work/ci-migration-report.json
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
